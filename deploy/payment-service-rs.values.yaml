# SPDX-License-Identifier: MIT
# Copy to gluon environments/local/payment-service-rs.values.yaml: the Rust
# payment-service, installed by bin/k8s-local-up under the same release name
# when its <SVC>_IMPL=rust. The same env vars as payment-service.values.yaml (copy
# them from there); the chart's JVM-only settings blanked.
image:
  repository: payment-service-rs
  tag: latest

javaOpts: ""
mallocArenaMax: ""

env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://tempo:4318
  - name: POSTGRES_HOST
    value: payment-postgres
  - name: POSTGRES_DB
    value: payment
  - name: POSTGRES_USER
    value: payment
  - name: POSTGRES_PASSWORD
    value: payment
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: kafka:9092
